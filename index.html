<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Arms Dealer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231E3429'/%3E%3Cpath d='M16 5l9 11-9 11-9-11z' fill='none' stroke='%23D2A94A' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23D2A94A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEE9; --card:#FAFBF8; --card-2:#F3F5F0; --line:#D7DBD3; --line-soft:#E4E7E0;
  --ink:#1E2622; --muted:#66706A; --faint:#98A19B;
  --spruce:#14231C; --spruce-2:#1E3429; --spruce-3:#2B4538; --spruce-ink:#AFC0B6;
  --primary:#1F4A38; --primary-2:#173A2C;
  --brass:#A97F25; --brass-2:#D2A94A; --brass-soft:#F1E7CC; --brass-ink:#6E5114; --ivory:#F2EBD6;
  --brick:#B03F2E; --brick-soft:#F4DDD7; --ok:#2F7A4B; --ok-soft:#DCEBDD; --warn-soft:#F6EBC8;
  --ammo:#A8613A; --gun:#4C5E73; --gear:#2E7F78;
  --stealth:#4B5B94; --assault:#B03F2E; --tech:#2E7F78; --grand:#A97F25;
  --focus:#3566D6; --r-card:14px; --r-ctl:8px; --sidebar:228px;
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.45; color:var(--ink); -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{min-height:100vh}
[data-bind],.num,.stat .v,.sk-node,.chance .big,.hint b{font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .num{font-variant-numeric:tabular-nums}
.money{color:var(--brass-ink);font-weight:600}
.bad{color:var(--brick)} .good{color:var(--ok)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.side{background:var(--spruce);color:var(--spruce-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;color:var(--ivory);font-weight:650;font-size:17px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-ctl);background:none;color:var(--spruce-ink);font-weight:500;text-align:left}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button[aria-current=page]{background:var(--spruce-2);color:#fff}
.nav svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--brass);color:#1a1405;font-size:12px;font-weight:700;text-align:center}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--spruce-3);display:flex;flex-direction:column;gap:6px}
.side-foot .who{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot button{background:none;border:0;padding:2px 0;color:var(--spruce-ink);text-align:left;font-size:14px}
.side-foot button:hover{color:#fff;text-decoration:underline}

.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;padding:12px 28px;background:rgba(236,238,233,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.01em;line-height:1.15}
.stat .v.brass{color:var(--brass-ink)}
.stat .sub{font-size:12.5px;color:var(--muted)}
.xp{width:130px}
.xp .bar{margin-top:7px}
.topbar .grow{flex:1}
.sp-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600}
.sp-pill:hover{border-color:#BFC5BB;background:#fff}
.sp-pill.has{background:var(--brass-soft);border-color:#DCC88E;color:var(--brass-ink)}

#page{padding:26px 28px 60px;max-width:1320px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:28px;font-weight:650;letter-spacing:-.02em}
.page-head .sub{color:var(--muted);margin-top:2px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:#fff;border-color:#BFC5BB}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#18130a}
.btn.brass:hover{background:#9a7320}
.btn.danger{color:var(--brick)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.poor{opacity:.5}
.btn.primary.poor{opacity:.55}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r-ctl);border:1px solid transparent;background:none;color:var(--muted)}
.icon-btn:hover{background:var(--card-2);border-color:var(--line);color:var(--ink)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:500}
.input{width:100%;padding:9px 12px;border-radius:var(--r-ctl);border:1px solid var(--line);background:#fff;transition:border-color .15s}
.input:hover{border-color:#BFC5BB}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;color:var(--ink)}
.chip:hover{background:#fff;border-color:#BFC5BB}
.chip[aria-pressed=true]{background:var(--spruce);border-color:var(--spruce);color:#fff}
.chip .n{opacity:.65;margin-left:5px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:550;background:#E6E9E2;color:#46514A;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:#245d3a} .pill.bad{background:var(--brick-soft);color:#8e2f20}
.pill.brass{background:var(--brass-soft);color:var(--brass-ink)} .pill.warn{background:var(--warn-soft);color:#6a5410}
.pill.stealth{background:#E1E5F4;color:#36447a} .pill.assault{background:var(--brick-soft);color:#8e2f20}
.pill.tech{background:#D9ECEA;color:#1f6560} .pill.grand{background:var(--brass-soft);color:var(--brass-ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none}
[data-cat=ammo]{--c:var(--ammo)} [data-cat=gun]{--c:var(--gun)} [data-cat=gear]{--c:var(--gear)}
.bar{height:6px;border-radius:99px;background:#E1E5DD;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c,var(--brass));transition:width .25s linear}
.bar.thick{height:10px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:34px;height:20px;border-radius:99px;background:#C7CDC3;position:relative;flex:none;transition:background .15s}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--primary)}
.switch input:checked+.track::after{transform:translateX(14px)}
.switch input:focus-visible+.track{outline:2px solid var(--focus);outline-offset:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.panel>h2{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-bottom:14px}
.panel.flush{padding:0;overflow:hidden}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- onboarding ---------- */
.guide{margin-bottom:20px;display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:center;padding:16px 20px;border-radius:var(--r-card);background:var(--brass-soft);border:1px solid #E2D2A2}
.guide h2{font-size:16px;font-weight:650}
.guide ol{grid-column:1/-1;margin:2px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;counter-reset:s}
.guide li{display:flex;gap:10px;align-items:flex-start;font-size:14px;counter-increment:s}
.guide li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:#fff;color:var(--brass-ink);border:1px solid #DCC88E}
.guide li.done{color:var(--muted);text-decoration:line-through}
.guide li.done::before{content:"\2713";background:var(--ok);color:#fff;border-color:var(--ok)}
.guide li button{background:none;border:0;padding:0;font:inherit;text-decoration:underline;text-underline-offset:2px;color:inherit;text-align:left}

/* ---------- production ---------- */
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:24px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:14px}
.slot header{display:flex;align-items:flex-start;gap:10px}
.slot header h3{font-size:16.5px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.slot header .meta{font-size:13px;color:var(--muted)}
.slot header .push{margin-left:auto}
.slot .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot .stats .k{display:block;font-size:12.5px;color:var(--muted)}
.slot .stats .v{font-size:16px;font-weight:620}
.slot .line{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
.slot .line b{color:var(--ink);font-weight:600}
.slot .upg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
.slot.empty-slot{align-items:center;justify-content:center;text-align:center;min-height:220px;border-style:dashed;background:transparent;gap:10px}
.slot.empty-slot p{color:var(--muted)}
.slot .boost{font-size:12.5px;color:var(--muted)}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line-soft);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{color:var(--faint);white-space:nowrap;font-size:13px}

/* ---------- list rows (warehouse / market / picker) ---------- */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line-soft)}
.row:first-child{border-top:0}
.row.head{padding-top:10px;padding-bottom:10px;font-size:13px;color:var(--muted);background:var(--card-2);border-bottom:1px solid var(--line-soft)}
.row .nm{display:flex;align-items:center;gap:10px;min-width:0}
.row .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--muted);font-size:13px;white-space:nowrap}
.row .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.wh .row{grid-template-columns:minmax(0,2.2fr) minmax(0,1.5fr) minmax(0,1.1fr) 252px}
.wh .qtycell{display:flex;flex-direction:column;gap:5px}
.wh .qtycell b{font-weight:600}
.mk .row{grid-template-columns:minmax(0,2fr) 80px 140px minmax(0,1fr) 74px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.toolbar .input{max-width:260px}

/* ---------- task force ---------- */
.hire-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px}
.hire{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card)}
.hire h3{font-size:16px;font-weight:650}
.hire p{font-size:13.5px;color:var(--muted)}
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.op{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card)}
.op header{display:flex;gap:10px;align-items:flex-start}
.op header h3{font-size:16.5px;font-weight:650}
.op header .meta{color:var(--muted);font-size:13px}
.op header .push{margin-left:auto;text-align:right}
.loadout{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slotbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;border-radius:var(--r-ctl);border:1px dashed #BCC3B8;background:var(--card-2);text-align:left;min-width:0}
.slotbtn:hover{border-color:var(--primary);background:#fff}
.slotbtn .k{font-size:12px;color:var(--muted)}
.slotbtn .v{font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotbtn.filled{border-style:solid;border-color:var(--line);background:#fff}
.slotbtn.wide{grid-column:1/-1}
.slotbtn[disabled]{opacity:.55;cursor:not-allowed}
.op footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}

/* ---------- missions ---------- */
.mis{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.mlist{display:flex;flex-direction:column;max-height:calc(100vh - 200px);position:sticky;top:96px}
.panel.flush.mlist{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
.mlist h3{font-size:13.5px;font-weight:600;color:var(--muted);padding:12px 16px 6px;background:var(--card);position:sticky;top:0;z-index:1}
.mitem{display:flex;flex-direction:column;gap:3px;padding:11px 16px;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left;width:100%}
.mitem:hover{background:var(--card-2)}
.mitem[aria-current=true]{background:#E9EFE9;box-shadow:inset 3px 0 0 var(--primary)}
.mitem .t{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mitem .t b{font-weight:600}
.mitem .s{display:flex;gap:10px;font-size:13px;color:var(--muted)}
.mitem.locked{opacity:.6}
.plan{display:flex;flex-direction:column;gap:18px}
.plan h2{font-size:22px;font-weight:650;letter-spacing:-.015em}
.reward{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.reward .k{display:block;font-size:12.5px;color:var(--muted)}
.reward .v{font-size:17px;font-weight:640}
.reqs{display:flex;gap:8px;flex-wrap:wrap}
.req{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px}
.req b{font-weight:650}
.req.met{border-color:#B9D6BF;background:var(--ok-soft);color:#245d3a}
.req.miss{border-color:#EBC4BB;background:var(--brick-soft);color:#8e2f20}
.meter{position:relative}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.oplist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden;background:#fff}
.opr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft);cursor:pointer}
.opr:first-child{border-top:0}
.opr:hover{background:var(--card-2)}
.opr.off{opacity:.5;cursor:not-allowed}
.opr input{width:17px;height:17px;accent-color:var(--primary)}
.opr .ld{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chance{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chance .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:#8e2f20}
.errs li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brick);margin-right:8px;vertical-align:middle}
.runs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:20px}
.run{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);display:flex;flex-direction:column;gap:9px}
.run .t{display:flex;justify-content:space-between;gap:10px;font-weight:600}

/* ---------- skill tree ---------- */
/* each branch carries an anodised-metal colour; the map reads like a machined schematic */
.b-ammo{--c:#E09A64}.b-side{--c:#86AACF}.b-cqb{--c:#6FCBAE}.b-rifle{--c:#B9CC74}.b-heavy{--c:#EA7A68}.b-gear{--c:#58C6D6}.b-logi{--c:#E8C566}.b-ops{--c:#BBA2EA}
.sk-tools{margin-bottom:12px}
.sk-tools .chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.sk-wrap{position:relative;border-radius:var(--r-card);overflow:hidden;background:#0F1A15;border:1px solid #0A120E;height:clamp(440px,calc(100vh - 300px),980px);user-select:none;-webkit-user-select:none}
.sk-view{position:absolute;inset:0;cursor:grab;touch-action:none;
  background-image:radial-gradient(#2C4638 1px,transparent 1.4px),radial-gradient(ellipse at 50% 30%,#1D3429 0%,#13221A 55%,#0B130F 100%);background-size:26px 26px,100% 100%}
.sk-view.drag{cursor:grabbing}
.sk-inner{position:absolute;left:0;top:0;transform-origin:0 0}
.sk-edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.sk-edges path{fill:none;stroke:#273B30;stroke-width:2;stroke-linecap:round}
.sk-edges path.e-open{stroke:color-mix(in srgb,var(--c) 80%,transparent);stroke-width:2.4;stroke-dasharray:5 8;animation:sk-flow 1.1s linear infinite}
.sk-edges path.e-own{stroke:var(--c);stroke-width:3}
.sk-edges path.hl{stroke:color-mix(in srgb,var(--c) 35%,#fff);stroke-opacity:1;stroke-width:3.6;stroke-dasharray:none;animation:none}
@keyframes sk-flow{to{stroke-dashoffset:-13}}
.sk-panel{position:absolute;border:1px solid color-mix(in srgb,var(--c) 20%,#1E3227);border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,transparent),rgba(255,255,255,.012) 300px)}
.sk-panel h3{position:absolute;left:24px;top:14px;color:#F2EBD6;font-size:21px;font-weight:650;letter-spacing:-.01em}
.sk-panel .cnt{position:absolute;right:24px;top:19px;color:color-mix(in srgb,var(--c) 55%,#8FA698);font-size:13px}
.sk-prog{position:absolute;left:24px;right:24px;top:46px;height:3px;border-radius:3px;background:rgba(255,255,255,.07)}
.sk-prog i{display:block;height:100%;width:0;border-radius:3px;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent);transition:width .5s ease}
.sk-lane{position:absolute;color:color-mix(in srgb,var(--c) 40%,#8FA698);font-size:11.5px;text-align:center;line-height:1.2;font-weight:500}
.sk-node{position:absolute;width:36px;height:36px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 35%,#1E3127);background:#15261E;color:color-mix(in srgb,var(--c) 60%,#6E8678);font-weight:650;font-size:12.5px;display:grid;place-items:center;padding:0;line-height:1;transition:background .2s,border-color .2s,box-shadow .2s,opacity .2s}
.sk-node span{display:block;pointer-events:none}
.sk-node.unlock{border-radius:9px;transform:rotate(45deg);width:32px;height:32px;margin:2px}
.sk-node.unlock span{transform:rotate(-45deg)}
.sk-node.key{width:46px;height:46px;font-size:14px;outline:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);outline-offset:3px}
.sk-node.key.unlock{width:40px;height:40px;margin:3px}
.sk-node.lock{opacity:.5}
.sk-node.poor{color:#D2DED6;border-color:color-mix(in srgb,var(--c) 75%,transparent)}
.sk-node.buy{background:#F4EEDA;border-color:var(--c);color:#14231C;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 26%,transparent);animation:sk-ready 2.6s ease-in-out infinite}
.sk-node.own{background:var(--c);border-color:color-mix(in srgb,var(--c) 55%,#fff);color:#111b14;box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.sk-node.sel{outline:2px solid #fff;outline-offset:3px}
.sk-node.hit{box-shadow:0 0 0 3px #fff,0 0 20px 5px rgba(242,235,214,.6)}
.sk-node:hover{border-color:#fff}
.sk-node.dimf{opacity:.14}
.sk-node.pop::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid var(--c);animation:sk-pop .85s ease-out forwards;pointer-events:none}
@keyframes sk-ready{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 7%,transparent),0 0 16px color-mix(in srgb,var(--c) 38%,transparent)}}
@keyframes sk-pop{from{transform:scale(1);opacity:1}to{transform:scale(2.6);opacity:0}}
.sk-label{position:absolute;text-align:center;font-size:11.5px;line-height:1.15;font-weight:500;color:#9DB3A5;pointer-events:none;display:none;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;border-radius:4px;background:rgba(13,23,18,.74);padding:1px 2px}
.sk-inner.lbl .sk-label{display:-webkit-box}
.sk-label.buy{color:#F4EEDA}
.sk-label.own{color:color-mix(in srgb,var(--c) 70%,#fff)}
.sk-label.lock{color:#6E8678}
.sk-label.hit{color:#fff;background:rgba(122,96,36,.85)}
.sk-label.dimf{display:none!important}
.sk-inner.hov .sk-node:not(.hl){opacity:.22}
.sk-inner.hov .sk-label:not(.hl){opacity:.18}
.sk-inner.hov .sk-edges path:not(.hl){opacity:.12}
.sk-node.hl{opacity:1!important;border-color:#fff}
/* zoomed far out: branch names become the map */
.sk-inner.far .sk-lane{display:none}
.sk-inner.far .sk-panel h3{font-size:44px;top:-60px;left:6px;white-space:nowrap}
.sk-inner.far .sk-panel .cnt{font-size:24px;top:-46px;right:6px}

.sk-inner.far .sk-edges path.e-own{stroke-width:7}
.sk-inner.far .sk-edges path.e-open{animation:none;stroke-dasharray:none}
.sk-search{position:absolute;left:14px;top:14px;z-index:3;width:min(262px,calc(100% - 90px));display:flex;flex-direction:column;gap:6px}
.sk-search .input,.sk-select{background:rgba(15,27,21,.94);border:1px solid #2B4538;color:#F2EBD6;border-radius:var(--r-ctl)}

.sk-row{display:flex;gap:6px}
.sk-select{flex:1;min-width:0;padding:6px 8px;font-size:13px}
.sk-btn{flex:none;padding:6px 10px;font-size:13px;font-weight:550;border-radius:var(--r-ctl);background:rgba(15,27,21,.94);border:1px solid #2B4538;color:#F2EBD6}
.sk-search .hint{color:#9DB3A5;padding:3px 10px;border-radius:99px;align-self:flex-start;background:rgba(15,27,21,.94);border:1px solid #2B4538}

.sk-zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:3}

.sk-mini{position:absolute;right:14px;bottom:14px;width:230px;z-index:3;border-radius:10px;border:1px solid #2B4538;background:rgba(10,18,14,.88);cursor:crosshair;touch-action:none}
.sk-mini .mm-b{position:absolute;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);overflow:hidden}
.sk-mini .mm-b u{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);opacity:.85;text-decoration:none}
.sk-mini .mm-v{position:absolute;border:1.5px solid #F2EBD6;border-radius:2px;background:rgba(242,235,214,.08);pointer-events:none}
.sk-detail{position:absolute;left:14px;bottom:14px;width:min(350px,calc(100% - 28px));background:var(--card);color:var(--ink);border-radius:14px;border-top:3px solid var(--c,#9DB3A5);padding:16px;box-shadow:0 14px 36px rgba(0,0,0,.45);z-index:4;display:flex;flex-direction:column;gap:10px}

.sk-legend i.p{background:#15261E;border-color:var(--brass)}

/* ---------- players ---------- */

.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:550}
.qtyrow{display:flex;gap:8px}
.qtyrow .input{flex:1}

#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 36px))}

.toast.error{background:#7C2A1E} .toast.ok{background:#1F4A38}

/* ---------- auth ---------- */
.auth{grid-column:1/-1;min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(400px,100%);display:flex;flex-direction:column;gap:20px}
.auth-brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.auth-brand svg{width:40px;height:40px}
.auth-card .panel{display:flex;flex-direction:column;gap:16px;padding:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#E3E6DF;border-radius:10px}
.tabs button{padding:8px;border:0;border-radius:7px;background:none;font-weight:550;color:var(--muted)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.form-err{min-height:20px;font-size:13.5px;color:var(--brick)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;font-size:13.5px}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .cols2,.social{grid-template-columns:1fr}

}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom));z-index:40;border-top:1px solid var(--spruce-3)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between;gap:0}
  .nav button{flex-direction:column;gap:2px;padding:6px 0;font-size:10px;letter-spacing:-.01em;text-align:center;justify-content:center;flex:1;min-width:0;position:relative}
  .nav .badge{position:absolute;right:4px;top:2px;margin:0;min-width:16px;padding:0 5px;font-size:10px}
  .topbar{padding:10px 16px;gap:16px;overflow-x:auto}
  .xp{display:none}
  #page{padding:20px 16px 96px}
  .wh .row{grid-template-columns:minmax(0,1fr) auto}
  .wh .row .qtycell{grid-column:1}
  .wh .row .px{grid-column:1}
  .wh .row .acts{grid-column:2;grid-row:1/span 3;align-self:center;flex-direction:column}
  .wh .row.head{display:none}
  .mk .row{grid-template-columns:minmax(0,1fr) auto}
  .mk .row.head{display:none}
  .mk .row .acts{grid-column:2;grid-row:1/span 2}
  .lb .row{grid-template-columns:28px minmax(0,1fr) 54px 64px}
  .lb .row .earn{display:none}
  .guide{grid-template-columns:1fr}
  .sk-wrap{height:calc(100vh - 290px);min-height:420px}
  .sk-mini{display:none}
  #toasts{bottom:78px;right:12px}
  .row{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- quality of life ---------- */
.nav .badge.alert{background:var(--ok);color:#fff}
.select{padding:8px 10px;border-radius:var(--r-ctl);border:1px solid var(--line);background:#fff;cursor:pointer;max-width:210px;transition:border-color .15s}
.select:hover{border-color:#BFC5BB}
.select:focus-visible{outline:2px solid var(--focus);outline-offset:0}
.toolbar .select{flex:0 0 auto}
.eta{font-size:12.5px;color:var(--muted);margin-top:-2px}
.eta:empty{display:none}
.mtools{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line-soft)}
.away{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:14px 0 4px;padding:14px 16px;border-radius:var(--r-ctl);background:var(--card-2);border:1px solid var(--line-soft)}
.away .k{display:block;font-size:12.5px;color:var(--muted)}
.away .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
h3.mini{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.kb{list-style:none;margin:0;padding:0}
.kb li{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.kb li:first-child{border-top:0}
.keys{display:inline-flex;gap:4px;flex:none;align-items:center}
kbd{display:inline-block;min-width:24px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);border-bottom-width:2px;background:var(--card);font:600 12px/1.5 inherit;text-align:center;color:var(--ink)}
.kb-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 32px}
.qtycell .bar i.full{background:var(--brass)}
@media (max-width:700px){.kb-cols{grid-template-columns:1fr}.toolbar .select{max-width:none;flex:1 1 140px}}

/* ---------- guide, profiles, ranks ---------- */
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
.lnk:hover,.lnk:focus-visible{text-decoration-color:currentColor}
.rankstat{background:none;border:0;padding:0;text-align:left;cursor:pointer;border-radius:8px}

.rankstat:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.gchip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.gchip:hover{background:#fff;border-color:#9FA89F}
.gchip i{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.cal h3{font-size:16px;font-weight:650}
.cal .meta{font-size:13px;color:var(--muted)}
.cal-stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted)}
.cal-stats b{color:var(--ink);font-weight:600}
.cal-guns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cal-guns .k{flex:1 1 100%;font-size:12.5px;color:var(--muted);font-weight:550}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:var(--card-2)}
#gd-body[data-tab=weapons] .row{grid-template-columns:minmax(0,2fr) 44px 78px minmax(0,1.5fr) minmax(0,1fr) 84px 112px}
#gd-body[data-tab=gear] .row{grid-template-columns:minmax(0,2fr) 44px minmax(0,1.2fr) minmax(0,1.2fr) 84px 112px}
.gd .toolbar .select{max-width:230px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;padding:18px}
.rule{padding:18px;box-shadow:none}
.rule h2{font-size:16px;font-weight:650;margin-bottom:6px}
.rule p,.rule ul{margin:8px 0 0;font-size:14px;line-height:1.5}
.rule ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rank-list{display:flex;flex-direction:column}
.rank{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line-soft)}
.rank:first-child{border-top:0}
.rank .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#E6E9E2;font-weight:650;font-size:13px;color:var(--muted)}
.rank.done .n{background:var(--spruce);color:var(--brass-2)}
.rank.you{background:var(--brass-soft)}
.rank small{color:var(--muted)}
.rank .req-rep{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.ok-line{color:var(--ok);font-weight:550}
.info p{margin:0;line-height:1.5}
.prof-head{display:flex;gap:16px;align-items:center}
.prof-head h3{font-size:21px;font-weight:680;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.avatar{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff;background:hsl(var(--h) 36% 30%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.rankline{display:flex;gap:8px;align-items:center;margin:5px 0 3px;font-size:13px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#B5BBB2;margin-right:6px}
.live.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.prof .kv dd{font-variant-numeric:tabular-nums}
.lb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 10px;flex-wrap:wrap}
.lb-head h2{margin:0;font-size:17px;font-weight:650}
.finder{flex:1;max-width:210px}
.toolbar.tight{padding:4px 18px 12px;gap:10px}
.lb .row{grid-template-columns:34px minmax(0,1.5fr) 54px 62px 62px 92px}
@media (max-width:900px){
  #gd-body .row{display:flex;flex-wrap:wrap;gap:4px 14px}

  .lb .row{grid-template-columns:28px minmax(0,1fr) 54px 64px}

  .finder{max-width:none}
}
@media (max-width:900px){
  .rankstat{max-width:124px}

  .sp-pill{white-space:nowrap}
  .sp-pill span{font-size:0}
  .sp-pill span::after{content:'SP';font-size:13px;font-weight:600}
}

<script>
(() => {
'use strict';

/* ---- Connection settings --------------------------------------------
   Embedded below. If you ever empty them, the game asks for a project URL

/* Estimate where the numbers are right now, between server snapshots. Mirrors the SQL tick. */
function project() {
  const dt = Math.max(0, Math.min(20, (Date.now() - S.t0) / 1000));
  let cash = S.player.cash, xp = S.player.xp; const inv = { ...S.inv }, prog = {}, cap = S.caps.storage;
  for (const sl of S.slots) {
    if (!sl.item) continue; const ln = S.lines[sl.item]; if (!ln) continue; const it = G.items[sl.item];
    const units = Number(sl.progress) + ln.rate * dt; let made = Math.floor(units);
    if (sl.auto) { if (cash < Math.ceil(ln.unit)) made = 0; }
    else if (ln.unit > 0) made = Math.min(made, Math.floor(cash / ln.unit));
    made = Math.max(0, made);
    if (made > 0) {
      if (sl.auto) cash += made * (fixerPrice(sl.item) - ln.unit);
      else {                                    // fills the warehouse, then the extra goes to the Fixer
        const room = Math.max(0, cap - (inv[sl.item] || 0)), over = Math.max(0, made - room);
        cash -= Math.ceil(made * ln.unit); cash += Math.floor(over * fixerPrice(sl.item));
        inv[sl.item] = (inv[sl.item] || 0) + made - over;
      }
      xp += made * it.base_value * 0.05 * (1 + (S.mods.xp_gain || 0));
    }
    prog[sl.idx] = units - Math.floor(units);
  }
  return { cash, xp, inv, prog };
}
function cashRate() {

    if (!sl.item) continue; const ln = S.lines[sl.item]; if (!ln) continue;
    if (sl.auto || (S.inv[sl.item] || 0) >= S.caps.storage) r += ln.rate * (fixerPrice(sl.item) - ln.unit);   // full warehouse sells the extra

}

function slotCard(sl) {

async function upgradeAll() {
  if (U.busy || !S) return;
  let cash = Math.floor((U.P ? U.P.cash : S.player.cash) * 0.985);
  const seen = new Set(), lines = [];
  for (const sl of S.slots) if (sl.item && S.lines[sl.item] && !seen.has(sl.item)) { seen.add(sl.item); lines.push({ id: sl.item, lv: S.lines[sl.item].level, n: 0 }); }
  for (;;) {                                       // cheapest next level first, until the money runs out
    let best = null, bc = Infinity;
    for (const l of lines) { if (l.lv + l.n >= 120) continue; const c = upgradeCost(l.id, l.lv + l.n, 1); if (c < bc) { bc = c; best = l; } }
    if (!best || bc > cash) break;
    cash -= bc; best.n++;
  }
  const buys = lines.filter(l => l.n > 0);
  if (!buys.length) { toast('You cannot afford an upgrade yet.', 'error'); return; }
  U.busy = true; let levels = 0, n = 0;
  try { for (const l of buys) { const r = await act('ad_upgrade', { p_item: l.id, p_times: l.n }); if (!r) break; levels += l.n; n++; } }
  finally { U.busy = false; }
  if (levels) toast(`Upgraded ${n} line${n > 1 ? 's' : ''} by ${levels} level${levels > 1 ? 's' : ''}.`, 'ok');
}

/* ---- auto-arm planner ------------------------------------------------------------
   Works on a copy of the warehouse. Returns the list of ad_equip calls to make and the tags it could not cover. */
function planLoadout(opsIn, req, opts = {}) {
  const inv = { ...S.inv }, plan = [], tags = {}, dead = new Set();
  const tv = it => it.tag_val || 1;
  const addT = id => { const it = id && G.items[id]; if (it && it.tag) tags[it.tag] = (tags[it.tag] || 0) + tv(it); };
  const subT = id => { const it = id && G.items[id]; if (it && it.tag) tags[it.tag] = (tags[it.tag] || 0) - tv(it); };
  const ops = opsIn.map(o => ({ id: o.id, tier: o.tier, xp: o.xp || 0, can: o.status === 'ready', gun: o.gun || null, g: [o.g1 || null, o.g2 || null, o.g3 || null] }));
  ops.forEach(o => { addT(o.gun); o.g.forEach(addT); });
  const put = (o, slot, item) => {
    const cur = slot === 'gun' ? o.gun : o.g[Number(slot[1]) - 1];
    inv[item]--; if (cur) { inv[cur] = (inv[cur] || 0) + 1; subT(cur); } addT(item);
    if (slot === 'gun') o.gun = item; else o.g[Number(slot[1]) - 1] = item;
    plan.push({ op: o.id, slot, item });
  };
  const gunsAll = G.itemList.filter(i => i.cat === 'gun').sort((a, b) => b.power - a.power);
  const gearAll = G.itemList.filter(i => i.cat === 'gear');
  const usable = g => (inv[g.id] || 0) > 0 && (inv[g.ammo] || 0) > 0;
  const order = ops.filter(o => o.can).sort((a, b) => b.tier - a.tier || b.xp - a.xp);

  // 1. everyone gets the best weapon we have ammunition for
  for (const o of order) {
    const g = gunsAll.find(usable); if (!g) break;
    const cur = o.gun && G.items[o.gun];
    if (!cur) put(o, 'gun', g.id);
    else if (opts.upgradeGuns && !cur.tag && g.power > cur.power) put(o, 'gun', g.id);   // never swap out a weapon that carries a tag such as suppressed
  }

  // 2. cover what the job asks for
  const gap = () => Object.entries(req || {}).map(([t, n]) => [t, n - (tags[t] || 0)]).filter(([t, d]) => d > 0 && !dead.has(t)).sort((a, b) => b[1] - a[1]);
  for (let guard = 0; guard < 80; guard++) {
    const g0 = gap()[0]; if (!g0) break;
    const [t, d] = g0;
    const cands = gearAll.filter(i => i.tag === t && (inv[i.id] || 0) > 0).sort((a, b) => tv(a) - tv(b));
    const gear = cands.find(i => tv(i) >= d) || cands[cands.length - 1];
    if (gear) {
      let target = null;                          // an empty gear slot on the least loaded operative, else a slot holding something the job does not use
      for (const o of [...order].sort((a, b) => a.g.filter(Boolean).length - b.g.filter(Boolean).length)) { const i = o.g.indexOf(null); if (i >= 0) { target = [o, 'g' + (i + 1)]; break; } }
      if (!target) for (const o of order) { const i = o.g.findIndex(x => x && !(req && req[G.items[x].tag])); if (i >= 0) { target = [o, 'g' + (i + 1)]; break; } }
      if (target) { put(target[0], target[1], gear.id); continue; }
    }
    const guns = gunsAll.filter(i => i.tag === t && usable(i));
    if (guns.length) {                            // some jobs want weapons with the tag, such as suppressed guns
      const gun = guns[0], pw = o => (o.gun ? G.items[o.gun].power : -1);
      // the job cannot launch without them, so trade firepower for the tag: swap out the weakest weapon that is not already covering a requirement
      const o = [...order].filter(x => !x.gun || !(G.items[x.gun].tag && req[G.items[x.gun].tag])).sort((a, b) => pw(a) - pw(b))[0];
      if (o) { put(o, 'gun', gun.id); continue; }
    }
    dead.add(t);
  }

  // 3. optional: fill what is left, favouring the tags the crew has least of
  if (opts.fillGear) {
    for (const o of order) for (let i = 0; i < 3; i++) {
      if (o.g[i]) continue;
      const mine = new Set(o.g.concat(o.gun).filter(Boolean).map(x => G.items[x].tag));
      const c = gearAll.filter(x => (inv[x.id] || 0) > 0 && !mine.has(x.tag)).sort((a, b) => (tags[a.tag] || 0) - (tags[b.tag] || 0) || tv(b) - tv(a) || b.tier - a.tier)[0];
      if (c) put(o, 'g' + (i + 1), c.id);
    }
  }
  const short = Object.entries(req || {}).filter(([t, n]) => (tags[t] || 0) < n).map(([t, n]) => `${TAGS[t] || t} x${n - (tags[t] || 0)}`);
  return { plan, short };
}
async function runPlan(plan) {
  U.busy = true; let n = 0;
  try { for (const p of plan) { const r = await act('ad_equip', { p_op: p.op, p_slot: p.slot, p_item: p.item }); if (!r) break; n++; } }

      <button class="btn sm" data-act="show-skill" data-id="${sk.id}">Show in skill tree</button>`;
  }
  let related = '';

    const gs = (G.ammoUsers[id] || []).map(x => G.items[x]).sort((a, b) => a.power - b.power);

    related = `<h3 class="mini">Ammunition</h3><div class="chipwrap">${am ? itemLink(am.id, `${esc(am.name)}<i>${isUnlocked(am) ? 'unlocked' : 'locked'}</i>`, 'gchip') : ''}</div>

  } else {

      <h3 class="mini">Jobs that ask for ${esc(TAGS[it.tag] || it.tag)}</h3>${jobs.length ? `<ul class="feed">${jobs.map(m => `<li><span>${esc(m.name)}</span><b>x${m.req[it.tag]}</b></li>`).join('')}</ul>` : '<p class="muted">No job asks for it.</p>'}
      ${same.length ? `<h3 class="mini">Other gear with the same tag</h3><div class="chipwrap">${same.map(x => itemLink(x.id, `${esc(x.name)}<i>x${x.tag_val}</i>`, 'gchip')).join('')}</div>` : ''}`;
  }
  openModal({
    title: it.name,
    html: `<div class="body info" data-cat="${it.cat}">
      <p class="muted" style="margin-top:-6px">${esc(itemSub(it))}.${blurb ? ' ' + esc(blurb) : ''}</p>
      <div class="away">${cell('Sells for', usd(sell))}${cell(ln ? 'Costs to make' : 'Base cost to make', usd(cost))}${it.cat === 'gun' ? cell('Firepower', String(it.power)) : cell('Tier', String(it.tier))}${cell('In warehouse', full(have))}</div>
      ${unlock}${related}</div>`,
    footer: `${isUnlocked(it) ? `<button class="btn" data-act="info-make" data-item="${id}">Make this</button>` : ''}<button class="btn primary" data-act="close">Close</button>`,
  });

const typingIn = t => !!(t && t.matches && t.matches('input:not([type=checkbox]):not([type=button]), textarea, select, [contenteditable]'));
document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') {
    if ($('.modal')) closeModal();
    else if (U.tab === 'skills' && U.sk.sel && !typingIn(e.target)) { U.sk.sel = null; refreshSkills(); }
    else if (typingIn(e.target)) e.target.blur();
  }
  if (k === 'Enter' && e.target.matches && e.target.matches('.modal input:not([type=checkbox]), .modal select')) {
    const b = $('.modal footer .btn.primary:not([disabled])'); if (b) { e.preventDefault(); b.click(); }
  }
  if (k === 'Enter' && e.target.dataset && e.target.dataset.model === 'skq') {
    e.preventDefault(); const h = $('.sk-node[data-hit="1"]');
    if (h) { U.sk.sel = h.dataset.id; focusNode(h.dataset.id); refreshSkills(); }
  }
  if (k === 'Tab') {
    const m = $('.modal'); if (m) {
      const f = $$('button:not([disabled]), input:not([disabled]), select, [tabindex="0"]', m).filter(x => x.offsetParent !== null);
      if (f.length) {
        const a = f[0], z = f[f.length - 1];
        if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      }
    }
  }

  /* page shortcuts: only when nothing is being typed and no dialog is open */
  if (!S || e.ctrlKey || e.metaKey || e.altKey || typingIn(e.target) || $('.modal')) return;
  if (k >= '1' && k <= String(NAV.length)) { go(NAV[Number(k) - 1].id); return; }
  if (k === '?') { e.preventDefault(); openHelp(); return; }
  if (k === '/') { const f = $('[data-model="mq"], [data-model="whq"], [data-model="skq"], [data-model="gq"], [data-model="lbq"]'); if (f) { e.preventDefault(); f.focus(); f.select && f.select(); } return; }
  const lk = k.toLowerCase();
  if (U.tab === 'production' && lk === 'u') { upgradeAll(); return; }
  if (U.tab === 'crew' && lk === 'a') { autoArm(); return; }
  if (U.tab === 'missions' && lk === 'g') { autoGear(); return; }
  if (U.tab === 'skills') {
    const step = e.shiftKey ? 300 : 90, v = $('.sk-view');
    const zoom = f => { if (!v) return; const r = v.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); };
    if (k === 'ArrowLeft') { e.preventDefault(); panBy(step, 0); }
    else if (k === 'ArrowRight') { e.preventDefault(); panBy(-step, 0); }
    else if (k === 'ArrowUp') { e.preventDefault(); panBy(0, step); }
    else if (k === 'ArrowDown') { e.preventDefault(); panBy(0, -step); }
    else if (k === '+' || k === '=') zoom(1.3);
    else if (k === '-' || k === '_') zoom(0.77);
    else if (k === '0') fitView(null, true);
    else if (lk === 'n') skNext();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { U.hiddenAt = Date.now(); saveSnap(); updateTitle(); return; }
  if (U.hiddenAt && Date.now() - U.hiddenAt > AWAY_SECS * 1000) U.welcomePending = true;
  U.hiddenAt = 0; updateTitle(); poll();
});
window.addEventListener('pagehide', saveSnap);

/* ---- boot ---------------------------------------------------------------------------- */
async function start() {
  if (!cfg()) { renderSetup(); return; }
  try { if (!G.itemList.length) indexCatalog(await rpc('ad_catalog')); }
  catch (e) {
    renderSetup(e.network ? (EMBEDDED ? 'Check your internet connection and try again.' : 'Cannot reach that server. Check the project URL.') : `The game tables are not installed on this Supabase project yet. Run the SQL file in the Supabase SQL editor, then try again. (${e.message})`);
    return;
  }
  if (TOKEN) {
    try { await enterGame(); return; }
    catch (e) {
      if (e.network) { U.authErr = e.message; }
      else { TOKEN = null; store.del('ad_token'); }
    }
  }
  renderAuth();
}
start();

})();
</script>
</body>
